<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPMC Rotator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      width: 280px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #7c83ff;
      letter-spacing: 1px;
    }

    .connection-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.connected    { background: #4caf50; box-shadow: 0 0 6px #4caf5080; }
    .dot.disconnected { background: #f44336; box-shadow: 0 0 6px #f4433680; }
    .dot.unknown      { background: #9e9e9e; }

    #statusText {
      font-size: 13px;
      color: #ccc;
    }

    .detail-row {
      padding: 8px 12px;
      background: #0f3460;
      border-radius: 8px;
      font-size: 12px;
      color: #aac4ff;
      min-height: 32px;
      margin-bottom: 10px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #cacheCount {
      font-size: 11px;
      color: #666;
    }

    #clearCache {
      font-size: 11px;
      color: #f44336;
      background: none;
      border: 1px solid #f4433650;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #clearCache:hover { background: #f4433615; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">LPMC</span>
  </div>

  <div class="connection-row">
    <div id="dot" class="dot unknown"></div>
    <span id="statusText">Проверяю соединение...</span>
  </div>

  <div class="detail-row" id="detailText">—</div>

  <div class="footer">
    <span id="cacheCount">Кэш: загружается...</span>
    <button id="clearCache">Очистить кэш</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
